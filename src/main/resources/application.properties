spring.application.name=library-jpa

# H2 database saved in a file (folder "data", inside the project)
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.username=sa
spring.datasource.password=sa

# Hibernate creates / updates the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Show in the log the SQL that Hibernate runs
spring.jpa.show-sql=true

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
